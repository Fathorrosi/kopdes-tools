<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gerai Kopdes Online — Belanja Digital Koperasi Desa</title>

    <!-- ===== SEO & SOCIAL SHARE ===== -->
    <meta name="description"
        content="Belanja produk sembako, hasil bumi, dan produk UMKM desa langsung dari Koperasi Desa." />
    <meta property="og:title" content="Gerai Kopdes Online — Belanja Digital Koperasi Desa" />
    <meta property="og:description" content="Belanja kebutuhan harian dan produk lokal desa dengan harga terjangkau." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#16a34a" />

    <!-- ===== PWA & MOBILE ICONS ===== -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kopdes Online" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ===== FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
        rel="stylesheet" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #F8FAFC;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== FULL SCREEN APP CONTAINER ===== */
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            opacity: 0;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        #app-frame.loaded {
            opacity: 1;
        }

        /* ===== SPLASH LOADING SCREEN ===== */
        #splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: #fff;
            z-index: 5;
            padding: 24px;
            text-align: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #splash.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-logo-img {
            width: 84px;
            height: 84px;
            object-fit: contain;
            border-radius: 20px;
            margin-bottom: 16px;
            background: #ffffff;
            padding: 6px;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.4);
            animation: pulseLogo 2s infinite ease-in-out;
        }

        .splash-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .splash-title span {
            color: #DC2626;
        }

        .splash-sub {
            font-size: 13.5px;
            color: #94A3B8;
            font-weight: 500;
            margin-bottom: 28px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #DC2626;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulseLogo {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body>

    <!-- ===== SPLASH LOADING ===== -->
    <div id="splash">
        <img src="/logo.png" class="splash-logo-img" alt="Logo Kopdes Samatan" />
        <div class="splash-title">Gerai <span>Kopdes Samatan</span></div>
        <div class="splash-sub">Koperasi Desa Samatan</div>
        <div class="spinner"></div>
    </div>

    <!-- ===== FULL SCREEN WEB APP ===== -->
    <iframe id="app-frame" title="Gerai Kopdes"
        allow="geolocation; camera; microphone; payment; clipboard-read; clipboard-write;"></iframe>

    <!-- ===== PWA INSTALL BANNER ===== -->
    <div id="pwa-install-banner"
        style="display:none;position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:0 auto;background:#0F172A;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,0.35);z-index:9999;align-items:center;gap:12px;border:1px solid rgba(255,255,255,0.12);">
        <img src="/icons/icon-192.png"
            style="width:40px;height:40px;border-radius:10px;object-fit:cover;background:#fff;padding:2px;flex-shrink:0;"
            alt="Logo" />
        <div style="flex:1;min-width:0;">
            <div style="font-weight:800;font-size:13px;line-height:1.2;color:#fff;">Pasang Aplikasi Kopdes</div>
            <div style="font-size:11px;color:#94A3B8;margin-top:2px;">Akses cepat di layar utama HP Anda</div>
        </div>
        <button id="pwa-install-btn"
            style="background:#DC2626;color:#fff;border:none;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;">
            Install
        </button>
        <button onclick="dismissPwaBanner()"
            style="background:transparent;border:none;color:#64748B;font-size:16px;cursor:pointer;padding:4px;"
            title="Tutup">
            ✕
        </button>
    </div>

    <script>
        function dismissPwaBanner() {
            var b = document.getElementById('pwa-install-banner');
            if (b) b.style.display = 'none';
            try { localStorage.setItem('kopdes_pwa_banner_shown', 'true'); } catch (e) { }
        }

        (function () {
            // Register Service Worker for PWA criteria
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(function (err) {
                    console.log('SW registration note:', err);
                });
            }

            var deferredPrompt = null;
            var installBanner = document.getElementById('pwa-install-banner');
            var installBtn = document.getElementById('pwa-install-btn');
            var bannerAlreadyShown = false;
            try { bannerAlreadyShown = localStorage.getItem('kopdes_pwa_banner_shown') === 'true'; } catch (e) { }

            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                deferredPrompt = e;
                if (installBanner && !bannerAlreadyShown) {
                    installBanner.style.display = 'flex';
                    try { localStorage.setItem('kopdes_pwa_banner_shown', 'true'); } catch (err) { }
                }
            });

            if (installBtn) {
                installBtn.addEventListener('click', function () {
                    dismissPwaBanner();
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then(function (choiceResult) {
                            deferredPrompt = null;
                        });
                    } else {
                        // iOS Safari / fallback
                        alert('Untuk memasang di HP:\nTekan tombol Bagikan (Share ⎋ / ⋮) pada browser Anda, lalu pilih "Tambahkan ke Layar Utama" (Add to Home Screen).');
                    }
                });
            }

            // Google Apps Script Base Endpoint
            var GAS_BASE_URL = 'https://script.google.com/macros/s/AKfycbz4jvCVCtVkljNxvLOA_Dj1WbsUHmrJsuaCOrCGwrG1VRscHc2Rv_7R_CYfbDy1PBwe/exec';

            var currentSearch = window.location.search || '';
            var currentPath = window.location.pathname || '';

            var initialPage = 'index';
            if (currentPath === '/admin' || currentPath.indexOf('/admin') === 0 || currentSearch.indexOf('page=admin') !== -1) {
                initialPage = 'admin';
            } else if (currentPath === '/courier' || currentPath.indexOf('/courier') === 0 || currentSearch.indexOf('page=courier') !== -1 || currentPath === '/kurir' || currentSearch.indexOf('page=kurir') !== -1) {
                initialPage = 'courier';
            }

            function getTargetGasUrl(page) {
                if (page && page !== 'index') {
                    return GAS_BASE_URL + '?page=' + page + '&embedded=1';
                }
                return GAS_BASE_URL + '?embedded=1';
            }

            var frame = document.getElementById('app-frame');
            var splash = document.getElementById('splash');

            frame.src = getTargetGasUrl(initialPage);

            frame.onload = function () {
                frame.classList.add('loaded');
                setTimeout(function () {
                    splash.classList.add('hidden');
                }, 300);
            };

            // Listen for internal navigation and PWA install events from Apps Script
            window.addEventListener('message', function (e) {
                if (!e.data) return;

                if (e.data.type === 'NAVIGATE') {
                    var page = e.data.page || 'index';

                    splash.classList.remove('hidden');
                    frame.classList.remove('loaded');
                    frame.src = getTargetGasUrl(page);

                    var newUrl = (page !== 'index') ? '?page=' + page : '/';
                    if (window.history && window.history.replaceState) {
                        window.history.replaceState(null, '', newUrl);
                    }
                } else if (e.data.type === 'PWA_INSTALL') {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                    } else {
                        alert('Untuk memasang di HP:\n\n1. Di Chrome Android: Tekan titik tiga (⋮) di kanan atas ➔ pilih "Instal Aplikasi" / "Tambahkan ke Layar Utama".\n2. Di Safari iPhone: Tekan tombol Bagikan (Share ⎋) di bawah ➔ pilih "Tambahkan ke Layar Utama" (Add to Home Screen).');
                    }
                }
            });

            // Fallback timeout to guarantee splash removal
            setTimeout(function () {
                frame.classList.add('loaded');
                splash.classList.add('hidden');
            }, 3000);
        })();
    </script>
</body>

</html>
